<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=block&text=%EB%A7%88%EB%A6%AC%EC%BD%94%EB%A7%88%EC%9D%B4%EB%A6%AC%EB%93%AC%EC%B9%98%20">
<div id="intro" aria-label="마리코, 마이 리듬 코치"><video id="intro-video" src="/mariko/assets/assets/intro/intro.3271e809ca4eea4379e5d52492877bf9.mp4" autoplay muted playsinline preload="auto"></video>
  <div id="intro-title" aria-hidden="true"><div class="t1">마리코</div><div class="t2">마이 리듬 코치</div></div></div>
<style>
  /* 제목: 동글동글한 3D 캐릭터와 어울리게 둥근 글꼴 Jua(구글 폰트, 이 글자들만 받음), 보라 빛 그림자. 캐릭터 위 빈 바탕에.
     영상이 움직이기 시작하는 순간(#intro.on)에 같이 떠오른다: 먼저 뜨면 글자만 보이고 그림이 늦게 나오는 것처럼 보인다(2026-10-20 사용자) */
  #intro-title { position: absolute; left: 0; right: 0; top: 12%; text-align: center; pointer-events: none; opacity: 0;
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  #intro.on #intro-title { animation: introTitle .5s ease-out forwards; }
  #intro-title .t1 { font-size: clamp(40px, 12vw, 60px); line-height: 1.1; color: #F4F2FF; letter-spacing: .02em; text-shadow: 0 2px 18px rgba(156,140,255,.5), 0 1px 2px rgba(0,0,0,.35); }
  #intro-title .t2 { margin-top: 6px; font-size: clamp(16px, 4.4vw, 21px); color: #C9C1FF; letter-spacing: .1em; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  @keyframes introTitle { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* 바탕은 영상의 실제 위·아래 색(재보정 뒤 대비가 올라가 #262E34보다 어둡다). 아이폰 홈 화면 앱은 상태 표시줄 칸을 이 바탕 위쪽 색으로 칠해서,
     색이 다르면 영상 위에 띠가 보였다(2026-10-21 사용자 캡처: 띠 #242E34, 영상 위 #1F252A) */
  #intro { position: fixed; inset: 0; z-index: 2147483647; background: linear-gradient(#21262B, #171C21); transition: opacity .22s; }
  #intro video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; } /* 움직이기 시작하는 순간 바로 보인다(멈춘 첫 장면 없이) */
  /* 넓은 화면(가로:세로가 4:5보다 넓음, 컴퓨터·가로 태블릿)만 가운데 둥근 세로 카드. 폰은 사파리에서 Claude 머리줄 때문에 화면이 조금 넓어져도(약 0.63) 꽉 채운다(2026-10-21 사용자 캡처) */
  @media (min-aspect-ratio: 4/5) { #intro-title { top: calc(24px + 8%); } #intro-title .t1 { font-size: 48px; } #intro-title .t2 { font-size: 18px; } }
  @media (min-aspect-ratio: 4/5) { #intro video { top: 24px; left: 50%; width: auto; height: calc(100% - 48px); aspect-ratio: 720 / 1600; transform: translateX(-50%); border-radius: 20px; } }
</style>
<script>
  (function () {
    var appStarted = false;
    function loadApp() { // 앱 코드 받기 (한 번만)
      if (appStarted) return; appStarted = true;
      var s = document.createElement("script"); s.src = "/mariko/_expo/static/js/web/entry-7febe4de3568388e478840dc5443e20e.js";
      (document.body || document.documentElement).appendChild(s);
    }
    setTimeout(loadApp, 1200);
    try {
    var box = document.getElementById("intro"), v = document.getElementById("intro-video");
    function finish() {
      loadApp();
      if (!box || box.getAttribute("data-done")) return;
      box.setAttribute("data-done", "1");
      box.style.opacity = "0";
      setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); window.__introDone = true; window.dispatchEvent(new Event("intro-done")); }, 240);
    }
    try { if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { box.parentNode.removeChild(box); loadApp(); return; } } catch (e) {}
    // 단축어에서 돌아오는 길(앱이 단축어를 연 지 10분 안, src/watchRelay.tsx의 rhythm-coach:watch-wait)이면 인트로를 건너뛴다
    try { var w = +localStorage.getItem("rhythm-coach:watch-wait"); if (w && Date.now() - w < 600000) { finish(); return; } } catch (e) {}
    v.muted = true;
    function show() { v.style.opacity = "1"; box.classList.add("on"); } // 영상과 제목을 같은 순간에
    v.addEventListener("playing", show);
    v.addEventListener("timeupdate", function () { if (v.currentTime > 0) show(); });
    v.addEventListener("ended", finish);
    v.addEventListener("error", finish);
    v.addEventListener("progress", function () { try { var b = v.buffered; if (b.length && v.duration && b.end(b.length - 1) >= v.duration - 0.05) loadApp(); } catch (e) {} });
    try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    setTimeout(function () { if (v.paused && v.currentTime === 0) finish(); }, 2500); // 자동 재생이 막혔으면
    setTimeout(finish, 6500);
    } catch (e) { loadApp(); }
  })();
</script>
